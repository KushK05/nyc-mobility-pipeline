[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-mobility-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "pyarrow>=16",
    "pandas>=2.2",
    "requests>=2.32",
    "db-dtypes>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.14", "responses>=0.25"]
dbt = ["dbt-core>=1.8", "dbt-bigquery>=1.8"]
chatbot = ["streamlit>=1.38", "anthropic>=0.40", "sqlglot>=25", "altair>=5"]
airflow = [
    "apache-airflow>=3.0",
    "apache-airflow-providers-http>=5",
    "apache-airflow-providers-airbyte>=5",
]

[tool.setuptools.packages.find]
where = ["airflow/include"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dbt: runs the dbt CLI"]
filterwarnings = ["error::DeprecationWarning:nyc_mobility.*"]
